# DeepSeek-V4-Flash-Vision-Exp — eugr b12x + native vision mod
#
# Serves deepseek-ai/DeepSeek-V4-Flash-Vision-Exp (DeepSeek's first multimodal
# V4, released 2026-08-31) on DGX Spark with native image input and DSpark
# speculative decoding intact.
#
# Checkpoint deltas vs the text-only 0731 model (from config diff):
#   * vision keys: 10 (32-block ViT, dim 1024, patch 14, 2D RoPE)
#   * num_nextn_predict_layers: 1 -> 3   -> DSpark k MUST be a multiple of 3
#     (k=5 is rejected: "k % 3 == 0 when k > n_predict"). k=6 here (smallest
#     valid k >= dspark block size 5).
#   * rms_norm_eps: 1e-6 -> 1e-20   -> OVERRIDDEN back to 1e-6 by the mod.
#     The b12x fused MHC Gram decode kernel hard-requires rms_eps == 1e-6; 1e-20
#     fails at determine_available_memory. RMSNorm eps is a div-by-zero
#     stabilizer; the override is bit-identical for bf16 output and is guarded
#     on vision_n_layers so text-only checkpoints are untouched.
#   * ffn.gate: + bias + bias_vl (modality-specific MoE routing bias; loaded,
#     not applied at routing — known limitation)
#
# VRAM note: the vision tower (~410M params / ~0.8 GiB bf16) is REPLICATED on
# every TP rank (not sharded) and adds peak activations. The KV pool may be
# smaller than an equivalent text-only run — revalidate max_model_len + pool
# after first launch.
#
# Images go in USER messages only (official restriction; system/assistant -> 400).
# Max 384 image tokens per image. Fidelity gap (documented): image tokens use
# the standard causal sparse pattern, not the reference's bidirectional
# within-image-span attention.

recipe_version: "2"
model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:20260810
min_nodes: 2

metadata:
  description: "vLLM serving deepseek-ai/DeepSeek-V4-Flash-Vision-Exp (native image input) on DGX Spark using the B12X docker + vision-exp mod"

mods:
  - mods/instanttensor-hybrid-draft-loader
  - mods/deepseek-v4-vision-exp

defaults:
  port: 8000
  host: 0.0.0.0
  # Required: with HF_HUB_OFFLINE, an unset served-model-name makes the model
  # label carry the HF cache path.
  served_model_name: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
  tensor_parallel: 2
  gpu_memory_utilization: 0.82
  kv_cache_dtype: fp8_ds_mla
  max_model_len: auto
  block_size: 256
  max_num_seqs: 5
  max_num_batched_tokens: 4096
  max_cudagraph_capture_size: 64
  # Vision-Exp num_nextn_predict_layers=3 -> k must be a multiple of 3; k=6 is
  # the smallest valid k >= dspark block size 5. Do NOT drop back to 5.
  num_speculative_tokens: 6
  thinking: "true"
  reasoning_effort: "high"

env:
  # Fixed PYTHONHASHSEED makes the KV-offload block content-hash chain
  # reproducible across restarts (NONE_HASH, kv_cache_utils.py:114). Unset ->
  # os.urandom(32) reseeds every restart -> fs-tier blocks never match.
  PYTHONHASHSEED: "0"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_MOE_SKIP_PADDING: "0"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"
  # Prefix-cache retention (florianbrede #44): keep completed branches cached
  # so replays skip re-prefill. Policy-only — does not shrink the KV pool.
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"

command: |
  vllm serve {model} \
      --host {host} \
      --port {port} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enable-chunked-prefill \
      --enable-prompt-tokens-details \
      --enable-flashinfer-autotune \
      --async-scheduling \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --default-chat-template-kwargs.thinking={thinking} \
      --default-chat-template-kwargs.reasoning_effort={reasoning_effort} \
      --override-generation-config '{"temperature":1.0,"top_p":0.95}' \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
      --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"greedy","attention_backend":"B12X_MLA_SPARSE"}'
